[pytest]
testpaths = tests
python_files = test_*.py
addopts = -q --strict-markers
# Os testes de retenção exercitam corrotinas do aiosqlite diretamente.
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
filterwarnings =
    # Aviso do proprio starlette.testclient sobre a migracao para httpx2;
    # nao ha acao do lado da aplicacao.
    ignore::DeprecationWarning:starlette.*
    ignore:Using `httpx` with `starlette.testclient` is deprecated.*
