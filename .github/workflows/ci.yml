name: CI

on:
  pull_request:
  push:
    branches: [main]

# Um push novo cancela a execucao anterior do mesmo branch: nada a ganhar
# esperando o resultado de um commit que ja foi substituido.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Testes Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Instalar dependências
        # requirements-dev.txt ja inclui requirements.txt. O indice de CPU do
        # torch evita baixar ~2GB de pacotes CUDA que o runner nao usa.
        run: |
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-dev.txt

      - name: Rodar a suíte
        run: pytest

  frontend:
    name: Build da UI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Instalar dependências
        run: npm ci

      # AUTH_SECRET nao entra aqui de proposito: e lida em tempo de requisicao,
      # nunca no build. Um placeholder de alta entropia no workflow so serviria
      # para a varredura de segredos apontar um falso positivo.
      - name: Build
        run: npm run build

  isolamento:
    name: Isolamento entre inquilinos (Postgres real)
    runs-on: ubuntu-latest
    # Este job existe porque os demais testes de isolamento leem codigo-fonte.
    # Eles travam que as rotas nao carregam o filtro no corpo — util, mas nao
    # prova que o cliente A nao ve o B. So um Postgres com RLS ativa prova.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: visioncam_teste
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: pip install pytest psycopg2-binary

      - name: Executar
        env:
          # O usuario `postgres` do container tem BYPASSRLS, igual a producao.
          # E proposital: o teste precisa exercitar exatamente o caminho real,
          # incluindo o SET LOCAL ROLE que torna a RLS efetiva. Rodar com um
          # papel ja restrito esconderia justamente o defeito que quase passou.
          DATABASE_URL_TESTE: postgres://postgres:postgres@localhost:5432/visioncam_teste
        run: pytest tests/integracao/ -v

  seguranca:
    name: Varredura de segredos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks compara commits; sem o historico ele nao tem o que varrer.
          fetch-depth: 0

      # Varre apenas os commits do PR, o que impede a entrada de segredos novos.
      # Segredos que já estão no histórico não são pegos aqui — para esses, a
      # única resposta válida é revogar a credencial, já que reescrever o
      # histórico não desfaz o que foi publicado.
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
